name: CTF Hollow Press passive OSINT

on:
  push:
    branches: [ctf-hollow-press-20260907]
  workflow_dispatch:

jobs:
  passive-osint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inspect public YouTube channel metadata
        shell: bash
        run: |
          python -m pip install -q -U yt-dlp
          yt-dlp --dump-single-json --playlist-end 1 'https://www.youtube.com/channel/UCo59XG4ADT3Xm3hoH5FoEDg' > /tmp/channel.json || true
          python - <<'PY'
          import json,re,requests
          p='/tmp/channel.json'
          try:
              d=json.load(open(p))
              for k in sorted(d):
                  if any(x in k.lower() for x in ['channel','date','time','upload','title','id','description']):
                      print(k,repr(d[k])[:2000])
          except Exception as e:
              print('JSON ERR',e)
          u='https://www.youtube.com/channel/UCo59XG4ADT3Xm3hoH5FoEDg/about'
          r=requests.get(u,headers={'User-Agent':'Mozilla/5.0'},timeout=30)
          print('ABOUT',r.status_code,len(r.text))
          for needle in ['joinedDateText','publishDate','dateText','vanityChannelUrl','channelId']:
              print('\n--',needle,'--')
              for m in re.finditer(r'.{0,400}'+needle+r'.{0,900}',r.text,re.I|re.S):
                  print(re.sub(r'\s+',' ',m.group(0))[:1600])
          PY
