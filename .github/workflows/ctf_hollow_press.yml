name: CTF Hollow Press passive OSINT

on:
  push:
    branches: [ctf-hollow-press-20260907]
  workflow_dispatch:

jobs:
  passive-osint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inspect generic public Skype resolver UI
        shell: bash
        run: |
          python - <<'PY'
          import requests,re
          pages=[
            'https://www.vedbex.com/skyperesolver',
            'https://www.vedbex.com/tools/skyperesolver'
          ]
          for u in pages:
              try:
                  r=requests.get(u,headers={'User-Agent':'Mozilla/5.0'},timeout=20)
                  print('\n===',u,r.status_code,len(r.text),'===')
                  text=r.text
                  for needle in ['registration','timestamp','created','skype_id','skype_name','country','results','resolve']:
                      if needle.lower() in text.lower():
                          print('FOUND',needle)
                  for m in re.finditer(r'.{0,400}(?:registration|timestamp|created|skype_id|skype_name|results).{0,900}',text,re.I|re.S):
                      print(re.sub(r'\s+',' ',m.group(0))[:1600])
              except Exception as e:
                  print('ERR',u,e)
          PY
