name: CTF Hollow Press passive OSINT

on:
  push:
    branches: [ctf-hollow-press-20260907]
  workflow_dispatch:

jobs:
  passive-osint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inspect public client helper scripts
        shell: bash
        run: |
          python - <<'PY'
          import requests,re,urllib.parse
          s=requests.Session()
          s.headers.update({'User-Agent':'Mozilla/5.0','Referer':'https://www.vedbex.com/tools/email2skype'})
          u='https://www.vedbex.com/tools/email2skype'
          page=s.get(u,timeout=20).text
          srcs=re.findall(r'<script[^>]+src=["\']([^"\']+)',page,re.I)
          print('SCRIPTS',srcs)
          for src in srcs:
              url=urllib.parse.urljoin(u,src)
              try:
                  txt=s.get(url,timeout=20).text
              except Exception as e:
                  print('ERR',url,e); continue
              if 'lastindexOf' in txt or 'lastIndexOf' in txt or 'var string' in txt or 'string =' in txt:
                  print('\n===',url,'len',len(txt),'===')
                  for pat in ['lastindexOf','lastIndexOf','var string','string =']:
                      for m in re.finditer(re.escape(pat),txt,re.I):
                          a=max(0,m.start()-1200); b=min(len(txt),m.start()+3000)
                          print(txt[a:b])
          PY
