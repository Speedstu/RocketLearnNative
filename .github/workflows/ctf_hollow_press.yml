name: CTF Hollow Press passive OSINT

on:
  push:
    branches: [ctf-hollow-press-20260907]
  workflow_dispatch:

jobs:
  passive-osint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe public lookup API
        shell: bash
        run: |
          python - <<'PY'
          import requests,re,json,html
          from urllib.parse import urlencode
          s=requests.Session()
          s.headers.update({'User-Agent':'Mozilla/5.0','Origin':'https://www.vedbex.com','Referer':'https://www.vedbex.com/tools/email2skype'})
          page=s.get('https://www.vedbex.com/tools/email2skype',timeout=20).text
          print('PAGE',len(page))
          # Print the complete inline JS implementing token creation / request parameters.
          for m in re.finditer(r'<script[^>]*>(.*?)</script>',page,re.I|re.S):
              js=m.group(1)
              if 'skypesearch' in js or 'token_hash' in js:
                  print('=== INLINE_JS ===')
                  print(js[:18000])
          print('=== TOKEN ===')
          r=s.get('https://api.vedbex.com/v2/token',timeout=20)
          print('status',r.status_code)
          print('headers',dict(r.headers))
          print('body',r.text[:6000])
          PY
