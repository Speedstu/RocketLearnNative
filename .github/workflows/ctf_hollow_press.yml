name: CTF Hollow Press passive OSINT

on:
  push:
    branches: [ctf-hollow-press-20260907]
  workflow_dispatch:

jobs:
  passive-osint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inspect public app request flow
        shell: bash
        run: |
          python - <<'PY'
          import requests,re,urllib.parse
          h={'User-Agent':'Mozilla/5.0'}
          u='https://app.osint.industries/'
          s=requests.get(u,headers=h,timeout=30).text
          print('HTML',len(s))
          srcs=re.findall(r'<script[^>]+src=["\']([^"\']+)',s,re.I)
          print('SCRIPTS',len(srcs))
          for src in srcs:
              url=urllib.parse.urljoin(u,src)
              try: txt=requests.get(url,headers=h,timeout=30).text
              except Exception as e: print('ERR',url,e); continue
              needles=['/v2/request','api.osint.industries','performance','searchParams','query','selector']
              if any(n.lower() in txt.lower() for n in needles):
                  print('\n===',url,'LEN',len(txt),'===')
                  for needle in needles:
                      for m in list(re.finditer(re.escape(needle),txt,re.I))[:10]:
                          a=max(0,m.start()-900); b=min(len(txt),m.end()+1800)
                          print('---',needle,'---')
                          print(txt[a:b].replace('\n',' ')[:3000])
          PY
