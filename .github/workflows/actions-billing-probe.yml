name: Actions Billing Probe

on:
  issue_comment:
    types: [created]

permissions:
  issues: write
  contents: read
  actions: read

jobs:
  probe:
    if: github.event.issue.number == 8 && (github.event.comment.body == '[actions-billing-probe]' || github.event.comment.body == '[actions-forge-inspect]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Confirm hosted runner started
        if: github.event.comment.body == '[actions-billing-probe]'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number }}
        run: gh issue comment "$ISSUE" --repo "$REPO" --body "[actions-billing-probe-ok] run=$RUN_ID"

      - name: Inspect Champion Forge runs
        if: github.event.comment.body == '[actions-forge-inspect]'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number }}
        shell: bash
        run: |
          set -euo pipefail
          RUNS=$(gh api "repos/$REPO/actions/workflows/sideswipe-champion-forge.yml/runs?per_page=10")
          GEN5_ID=$(printf '%s' "$RUNS" | python -c 'import json,sys; d=json.load(sys.stdin); xs=[r for r in d.get("workflow_runs",[]) if "Gen5 champion forge" in r.get("display_title","")]; print(xs[0]["id"] if xs else "")')
          SUMMARY=$(printf '%s' "$RUNS" | python -c 'import json,sys; d=json.load(sys.stdin); print("\n".join(f"- run={r[chr(105)+chr(100)]} num={r.get(chr(114)+chr(117)+chr(110)+chr(95)+chr(110)+chr(117)+chr(109)+chr(98)+chr(101)+chr(114))} status={r.get(chr(115)+chr(116)+chr(97)+chr(116)+chr(117)+chr(115))} conclusion={r.get(chr(99)+chr(111)+chr(110)+chr(99)+chr(108)+chr(117)+chr(115)+chr(105)+chr(111)+chr(110))} title={r.get(chr(100)+chr(105)+chr(115)+chr(112)+chr(108)+chr(97)+chr(121)+chr(95)+chr(116)+chr(105)+chr(116)+chr(108)+chr(101))}" for r in d.get("workflow_runs",[])))')
          if [ -z "$GEN5_ID" ]; then
            BODY="[actions-forge-inspect-result]\nNo Gen5 workflow run found.\n$SUMMARY"
            gh issue comment "$ISSUE" --repo "$REPO" --body "$BODY"
            exit 0
          fi
          RUN=$(gh api "repos/$REPO/actions/runs/$GEN5_ID")
          JOBS=$(gh api "repos/$REPO/actions/runs/$GEN5_ID/jobs?per_page=100")
          ARTS=$(gh api "repos/$REPO/actions/runs/$GEN5_ID/artifacts?per_page=100")
          DETAIL=$(RUN="$RUN" JOBS="$JOBS" ARTS="$ARTS" python - <<'PY'
          import json, os
          r=json.loads(os.environ['RUN']); j=json.loads(os.environ['JOBS']); a=json.loads(os.environ['ARTS'])
          out=[f"GEN5_RUN={r['id']} status={r.get('status')} conclusion={r.get('conclusion')} attempt={r.get('run_attempt')} created={r.get('created_at')} updated={r.get('updated_at')}"]
          out.append('JOBS:')
          for x in j.get('jobs',[]): out.append(f"- id={x['id']} name={x.get('name')} status={x.get('status')} conclusion={x.get('conclusion')}")
          out.append('ARTIFACTS:')
          for x in a.get('artifacts',[]): out.append(f"- id={x['id']} name={x.get('name')} expired={x.get('expired')} size={x.get('size_in_bytes')}")
          print('\n'.join(out))
          PY
          )
          BODY="[actions-forge-inspect-result]\n$DETAIL\n\nRECENT FORGE RUNS:\n$SUMMARY"
          gh issue comment "$ISSUE" --repo "$REPO" --body "$BODY"
