name: SideSwipe Export Current Champion

on:
  issues:
    types: [opened]

permissions:
  contents: write

concurrency:
  group: sideswipe-export-current
  cancel-in-progress: true

jobs:
  export:
    if: contains(github.event.issue.title, '[sideswipe-export-current]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Download rolling champion and commit temporary export
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf cloud_sideswipe/current_export
          mkdir -p cloud_sideswipe/current_export
          gh release download sideswipe-pretrain-latest --pattern sideswipe_pretrained_latest.pt --dir /tmp
          test -s /tmp/sideswipe_pretrained_latest.pt
          SHA=$(sha256sum /tmp/sideswipe_pretrained_latest.pt | awk '{print $1}')
          SIZE=$(stat -c %s /tmp/sideswipe_pretrained_latest.pt)
          printf 'sha256=%s\nsize=%s\ntag=sideswipe-pretrain-latest\n' "$SHA" "$SIZE" > cloud_sideswipe/current_export/meta.txt
          base64 -w 0 /tmp/sideswipe_pretrained_latest.pt | fold -w 750000 | split -d -a 2 - cloud_sideswipe/current_export/part_
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cloud_sideswipe/current_export
          git commit -m 'chore: export current SideSwipe champion for local render' || exit 0
          git push
