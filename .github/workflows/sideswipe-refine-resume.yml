name: SideSwipe Refine Resume

on:
  issues:
    types: [opened]

permissions:
  contents: write
  actions: read

concurrency:
  group: sideswipe-refine-resume
  cancel-in-progress: false

env:
  SOURCE_SHA256: 6cfdcbee20581df966805f080437ffe533dd3b51676418b881ee7baf2342b96d
  TORCH_VERSION: '2.13.0'
  SOURCE_RUN_ID: '31980828089'

jobs:
  refine-release:
    if: contains(github.event.issue.title, '[sideswipe-refine-resume]')
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      RLS_SEED: '2026081699'
      RLS_ENVS: '1024'
      RLS_ENV_THREADS: '4'
      RLS_TORCH_THREADS: '4'
      RLS_MIXED: '1'
      RLS_RATIO_1V1: '0.67'
      RLS_TRANSFER_SAFE_OBS: '1'
      RLS_TICK_SKIP: '6'
      RLS_ROLLOUT_DECISIONS: '128'
      RLS_EPOCHS: '3'
      RLS_MINIBATCH: '32768'
      RLS_PAST_RATIO: '0.28'
      RLS_PAST_POOL: '12'
      RLS_FORCE_STAGE: '3'
      RLS_SAVE_EVERY: '10'
      RLS_VERSION_EVERY: '100'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Reconstruct verified source
        shell: bash
        run: |
          set -euo pipefail
          cat cloud_sideswipe/chunks/part_*.b64 | base64 -d > /tmp/sideswipe-src.tar.gz
          echo "${SOURCE_SHA256}  /tmp/sideswipe-src.tar.gz" | sha256sum -c -
          rm -rf cloud_sideswipe/src && mkdir -p cloud_sideswipe/src
          tar -xzf /tmp/sideswipe-src.tar.gz -C cloud_sideswipe/src

      - name: Install CPU PyTorch
        run: python -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu "torch==${TORCH_VERSION}"

      - name: Download tested binaries from Gen1 run
        uses: actions/download-artifact@v4
        with:
          name: sideswipe-linux-binaries-v2
          path: build
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ github.token }}

      - name: Download tournament champion from Gen1 run
        uses: actions/download-artifact@v4
        with:
          name: champion-base
          path: champion_base_raw
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ github.token }}

      - name: Normalize champion artifact and initialize refinement
        shell: bash
        run: |
          set -euo pipefail
          chmod +x build/sideswipe_train build/sideswipe_eval
          echo '[resume] champion artifact layout:'
          find champion_base_raw -maxdepth 4 -type f -printf '%p\n' | sort
          BASE_PT=$(find champion_base_raw -type f -name latest.pt -print -quit)
          test -n "$BASE_PT"
          test -s "$BASE_PT"
          mkdir -p champion_base champion_refined
          cp "$BASE_PT" champion_base/latest.pt
          for f in manifest.json metrics.tsv train.log tournament.log; do
            src=$(find champion_base_raw -type f -name "$f" -print -quit || true)
            if [ -n "$src" ]; then cp "$src" "champion_base/$f"; fi
          done
          cp champion_base/latest.pt champion_refined/latest.pt
          : > champion_refined/refine.log
          echo "[resume] base=$BASE_PT bytes=$(stat -c%s champion_base/latest.pt)"

      - name: Refinement 1/2
        shell: bash
        run: |
          set -euo pipefail
          export LD_LIBRARY_PATH=$(python -c 'import torch,pathlib; print(pathlib.Path(torch.__file__).parent/"lib")'):${LD_LIBRARY_PATH:-}
          export RLS_CHECKPOINTS="$GITHUB_WORKSPACE/champion_refined"
          ./build/sideswipe_train --train-updates 110 2>&1 | tee -a champion_refined/refine.log
          test -s champion_refined/latest.pt

      - name: Upload refinement recovery
        uses: actions/upload-artifact@v4
        with:
          name: champion-refinement-recovery-resume
          path: |
            champion_refined/latest.pt
            champion_refined/metrics.tsv
            champion_refined/refine.log
          retention-days: 14

      - name: Refinement 2/2 and selection
        shell: bash
        run: |
          set -euo pipefail
          export LD_LIBRARY_PATH=$(python -c 'import torch,pathlib; print(pathlib.Path(torch.__file__).parent/"lib")'):${LD_LIBRARY_PATH:-}
          export RLS_CHECKPOINTS="$GITHUB_WORKSPACE/champion_refined"
          ./build/sideswipe_train --train-updates 110 2>&1 | tee -a champion_refined/refine.log
          python cloud_sideswipe/src/select_refined.py | tee refine_selection.log
          test -s final_champion/latest.pt
          cp final_champion/latest.pt sideswipe_pretrained_latest.pt

      - name: Upload final checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: sideswipe-pretrained-champion
          path: |
            sideswipe_pretrained_latest.pt
            final_champion/refine_manifest.json
            champion_refined/refine.log
            refine_selection.log
          retention-days: 90

      - name: Publish rolling prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release delete sideswipe-pretrain-latest --yes --cleanup-tag >/dev/null 2>&1 || true
          gh release create sideswipe-pretrain-latest \
            sideswipe_pretrained_latest.pt \
            final_champion/refine_manifest.json \
            --target "$GITHUB_SHA" \
            --title "SideSwipe Pretrained Champion" \
            --notes "Recovered Gen1 refinement from run 31980828089 after artifact path normalization. Multi-seed PPO self-play champion selected by deterministic 1v1/2v2 tournament, then advanced-stage refinement gated against the base champion. Contract 2026081602. Strong bootstrap checkpoint; no unverified rank claim." \
            --prerelease
