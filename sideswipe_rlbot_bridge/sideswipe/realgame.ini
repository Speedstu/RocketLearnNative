# SideSwipe real-game bridge calibration.
# Required game settings: Camera Zoom Method=Zoomed Out, Static Joystick=ON, Air Roll=OFF.

[screen]
# Pixel coordinates are authored against this reference resolution and are scaled
# automatically to the actual emulator frame dimensions.
reference_width = 1920
reference_height = 1080
px_left = 120
px_right = 1800
px_floor = 880
px_ceiling = 150
world_left = -2560
world_right = 2560
world_floor = 0
world_ceiling = 2688

[colors]
ball_rgb = 236,236,236,52
blue_rgb = 58,130,246,70
orange_rgb = 245,148,54,70
scan_step = 3
min_pixels = 12

[pad]
stick_x = 260
stick_y = 820
stick_r = 150
jump_x = 1660
jump_y = 860
boost_x = 1500
boost_y = 700

[input]
touch_device =

[capture]
capture_backend = stream
